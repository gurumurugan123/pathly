services:
  # Backend Django REST API
  - type: web
    name: jobgraph-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn jobgraph_backend.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jobgraph-db
          property: connectionString

  # Frontend Vite React SPA
  - type: web
    name: jobgraph-frontend
    env: static
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: jobgraph-backend
          property: host

databases:
  - name: jobgraph-db
    databaseName: jobgraph
    user: jobgraph_user
    plan: free
